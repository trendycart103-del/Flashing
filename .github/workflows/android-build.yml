name: FlashForge Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build FlashForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Find ZIP File
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name "*.zip"
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          echo "ZIP_FILE=${ZIP_FILES[0]}" >> "$GITHUB_ENV"

          echo "ZIP selected:"
          echo "${ZIP_FILES[0]}"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction successful."

      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find \
            "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( -name "settings.gradle.kts" \
            -o -name "settings.gradle" \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set Up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find \
            "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -path "*/bin/sdkmanager" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDK Manager:"
          echo "$SDKMANAGER"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" \
            >> "$GITHUB_PATH"

          echo "$(dirname "$SDKMANAGER")" \
            >> "$GITHUB_PATH"

          echo "SDKMANAGER=$SDKMANAGER" \
            >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            || true

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK components installed."

      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "SDK Packages:"
          "$SDKMANAGER" --list_installed

      - name: Gradle Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"

          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.49-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-Build-Reports
          path: |
            extracted/**/build/reports/
            extracted/**/build/outputs/
          if-no-files-found: ignore
          retention-days: 14

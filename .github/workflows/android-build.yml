
name: FlashForge Android APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build FlashForge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Locate ZIP File
        id: locate_zip
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP file found:"
          echo "$ZIP_FILE"

      - name: Extract Android Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "ZIP extraction completed."

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name "settings.gradle.kts" \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "settings.gradle" \
              -exec dirname {} \; \
              | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            echo "ZIP must contain settings.gradle or settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk"

          echo "Searching for APK files..."

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          DEBUG_APK=$(find "$APK_DIR/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found!"
            exit 1
          fi

          echo "DEBUG APK VERIFIED:"
          echo "$DEBUG_APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.50-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.50-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Build Information
        if: always()
        run: |
          echo "===================================="
          echo "FlashForge Android Build"
          echo "===================================="
          echo "Version: 1.50"
          echo "Java: 17"
          echo "Gradle: 8.7"
          echo "Android SDK: API 34"
          echo "===================================="

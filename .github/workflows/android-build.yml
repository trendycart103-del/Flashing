
name: FlashForge v1.52 Android Build

on:
  workflow_dispatch:

  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: flashforge-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract uploaded ZIP
      - name: Extract FlashForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Upload exactly ONE ZIP file."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/flashforge-source"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting: ${ZIP_FILES[0]}"
          unzip -q "${ZIP_FILES[0]}" -d "$EXTRACT_DIR"

          mapfile -t PROJECT_ROOTS < <(
            find "$EXTRACT_DIR" \
              -type f \
              -name 'settings.gradle.kts' \
              -printf '%h\n'
          )

          if [ "${#PROJECT_ROOTS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Android project."
            echo "Found: ${#PROJECT_ROOTS[@]}"
            exit 1
          fi

          PROJECT_ROOT="${PROJECT_ROOTS[0]}"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module missing."
            exit 1
          fi

          BUILD_DIR="$GITHUB_WORKSPACE/build-project"

          mkdir -p "$BUILD_DIR"
          cp -a "$PROJECT_ROOT/." "$BUILD_DIR/"

          echo "BUILD_PROJECT=$BUILD_DIR" >> "$GITHUB_ENV"

          echo "FlashForge extraction successful."

      # 3. Install Java 17
      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install Gradle
      - name: Set Up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 5. Setup Android SDK and install all packages
      - name: Set Up Android SDK and Packages
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 6. Verify environment
      - name: Verify Android Build Environment
        working-directory: ${{ env.BUILD_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Java..."
          java -version

          echo "Checking Gradle..."
          gradle --version

          echo "Checking Android SDK..."
          sdkmanager --list_installed

          echo "Checking project files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Environment verification successful."

      # 7. Test and compile APK
      - name: Test and Compile FlashForge
        working-directory: ${{ env.BUILD_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            clean \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      # 8. Verify APK
      - name: Verify Generated APK
        working-directory: ${{ env.BUILD_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "================================"
          echo "FLASHFORGE APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$APK"

      # 9. Upload APK
      - name: Upload FlashForge APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.52-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 10. Upload reports even if build fails
      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlashForge-v1.52-Build-Reports
          path: build-project/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
